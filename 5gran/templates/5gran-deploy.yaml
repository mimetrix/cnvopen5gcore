apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: 5gran
  labels:
    epc-mode: 5gran
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: 5gran
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        epc-mode: 5gran
    spec:    
      containers:
      - name: gnb
        imagePullPolicy: {{ .Values.ran.image.pullPolicy }}
        image: "{{ .Values.ran.image.repository }}:{{ .Values.ran.image.tag }}" 
        command: ["/bin/sh","-c","./nr-gnb -c /open5gs/config-map/5gran-gnb-configmap.yaml"]
        volumeMounts:
          - name: 5gran-gnb-config
            mountPath: /open5gs/config-map/5gran-gnb-configmap.yaml
            subPath: "5gran-gnb-configmap.yaml"
      - name: ue
        imagePullPolicy: {{ .Values.ran.image.pullPolicy }}
        image: "{{ .Values.ran.image.repository }}:{{ .Values.ran.image.tag }}"
        securityContext:
          privileged: true
        # Dynamically inject pod IP into UE config if placeholders exist (ngapIp / gtpIp set to 0.0.0.0)
        # This is to solve the issue when the traffic sending back from UPF to UE, as UE needs to know the correct IP
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        command:
          - /bin/sh
          - -c
          - |
            set -e
            CONFIG_IN=/open5gs/config-map/5gran-ue-configmap.yaml
            CONFIG_OUT=/tmp/ue-config.yaml
            if grep -q 'ngapIp: 0.0.0.0' "$CONFIG_IN" || grep -q 'gtpIp: 0.0.0.0' "$CONFIG_IN"; then
              sed "s/ngapIp: 0.0.0.0/ngapIp: ${POD_IP}/; s/gtpIp: 0.0.0.0/gtpIp: ${POD_IP}/" "$CONFIG_IN" > "$CONFIG_OUT"
            else
              cp "$CONFIG_IN" "$CONFIG_OUT"
            fi
            exec ./nr-ue -c "$CONFIG_OUT"
        volumeMounts:
          - name: 5gran-ue-config
            mountPath: /open5gs/config-map/5gran-ue-configmap.yaml
            subPath: "5gran-ue-configmap.yaml"
      - name: uebinder
        imagePullPolicy: {{ .Values.ran.image.pullPolicy }}
        image: "{{ .Values.ran.image.repository }}:{{ .Values.ran.image.tag }}"
        securityContext:
          privileged: true
        command: ["/bin/sh","-c","sh nr-binder 10.45.0.2 ping www.google.com"]
      volumes:
        - name: 5gran-gnb-config
          configMap:
            name: 5gran-gnb-config     
        - name: 5gran-ue-config
          configMap:
            name: 5gran-ue-config
